services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    user: "0:0"
    environment:
      # Required for JWT signing.
      - DELIGHT_MASTER_SECRET=${DELIGHT_MASTER_SECRET}
      # Optional push backend config (gorush sidecar).
      - DELIGHT_PUSH_BACKEND=${DELIGHT_PUSH_BACKEND:-gorush}
      - DELIGHT_GORUSH_URL=${DELIGHT_GORUSH_URL:-http://gorush:8088/api/push}
      - DELIGHT_PUSH_TOPIC=${DELIGHT_PUSH_TOPIC}
    volumes:
      - ${DELIGHT_DATA_DIR:-../deploy-data}/server:/data
    command:
      - --addr=:3005
      - --db-path=/data/delight.db
      - --log-file=/data/server.log
    depends_on:
      - gorush
    networks:
      - delight

  gorush:
    image: appleboy/gorush:latest
    restart: unless-stopped
    user: "0:0"
    command:
      - -c
      - /etc/gorush/config.yml
    volumes:
      - ${DELIGHT_DATA_DIR:-../deploy-data}/gorush/config.yml:/etc/gorush/config.yml:ro
      - ${DELIGHT_DATA_DIR:-../deploy-data}/gorush:/data:ro
    networks:
      - delight

  caddy:
    image: caddy:2.8
    restart: unless-stopped
    environment:
      - DELIGHT_HOSTNAME=${DELIGHT_HOSTNAME}
      - DELIGHT_EMAIL=${DELIGHT_EMAIL:-}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ${DELIGHT_DATA_DIR:-../deploy-data}/caddy/data:/data
      - ${DELIGHT_DATA_DIR:-../deploy-data}/caddy/config:/config
    depends_on:
      - server
    networks:
      - delight

networks:
  delight:
    driver: bridge
